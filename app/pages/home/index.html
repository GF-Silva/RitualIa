<!doctype html>
<html>
  <head>
    <title>RitualIA</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="app/pages/assets/favicon.ico" />
    <link rel="stylesheet" href="app/pages/globals.css" />
    <link rel="stylesheet" href="/app/pages/home/css/home.css" />
    <link rel="stylesheet" href="/app/pages/home/css/player.css" />
    <link rel="stylesheet" href="{{url_for('static', filename='components/toast/style.css') }}" />
  </head>

  <body>
    <img src="/app/pages/assets/logo.png" class="logo-bg" id="logo" />

    <div id="home" class="active">
      <div
        class="player-indicator"
        id="open-player-btn"
        onclick="
          event.stopPropagation();
          openPage('player');
        "
      >
        <div class="play-icon"></div>

        <div class="music-wave">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>

        <span>PLAYER</span>
      </div>

      <div class="main">
        <h2>GÊNEROS MUSICAIS</h2>

        <div class="cover-flow">
          <div id="cylinder"></div>
        </div>
      </div>

      <div class="painel" id="painel">
        <button class="voltar" onclick="closePanel()">⬅ VOLTAR</button>
        <h1>RITMOS MUSICAIS</h1>

        <img id="painelImg" />

        <div>
          <button class="seta" onclick="mudarSentimento(1)">▲</button>
          <div class="drum-wrapper">
            <div class="drum-cylinder" id="drumCylinder"></div>
          </div>
          <button class="seta" onclick="mudarSentimento(-1)">▼</button>
          <button id="submit__btn" onclick="submitData()">Selecionar</button>
        </div>
      </div>
    </div>

    <div id="player">
      <!-- INDICADOR GÊNEROS -->
      <div
        class="genre-indicator"
        id="open-home-btn"
        onclick="
          event.stopPropagation();
          openPage('home');
        "
      >
        <div class="back-icon"></div>

        <div class="music-wave">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>

        <span>GÊNEROS</span>
      </div>

      <div class="wrapper">
        <div class="row-player">
          <!-- ABA -->
          <div class="panel" id="panel" onclick="togglePanel()">
            <div class="panel-content">
              História detalhada do autor, com imagens antigas e recentes.
            </div>
          </div>

          <div class="arrow">➜</div>

          <!-- PLAYER -->
          <div class="player-box" id="playerBox">
            <div id="ytplayer"></div>

            <div class="info">
              <div id="author">Autor</div>
              <div id="music">Música</div>
            </div>

            <div class="time">
              <div id="currentMusicTime">0:00</div>
              <div id="musicDuration">0:00</div>
            </div>

            <div class="progress" role="progressbar">
              <div class="bar" id="bar"></div>
              <div class="dot" id="dot"></div>
            </div>
          </div>
        </div>

        <!-- FILA -->
        <div class="queue" id="queue">
          <div class="queue-header">
            <div>
              <div class="queue-title">fila de espera</div>
              <div class="queue-sub">Músicas</div>
            </div>

            <div class="queue-arrow" onclick="toggleQueue()">▼</div>
          </div>

          <div class="queue-list" id="queue-list"></div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/app/pages/config.js"></script>
    <script type="module" src="/app/pages/home/js/home.js"></script>

    <script type="module">
      import { playerControls } from "/app/pages/home/js/player.js";

      function changeMode() {
        if (window.location.pathname == "/copa") {
          alert("Alterando para o modo normal");
          window.location.href = "/";
        } else {
          alert("Alterando para o modo 'Copa'");
          window.location.href = "/copa";
        }
      }

      let clicks = 0;
      let ultimoClique = 0;
      document.getElementById("logo").addEventListener("click", () => {
        const agora = Date.now(); // Pega o tempo atual em milissegundos

        // Se o tempo desde o último clique for maior que 500ms, reinicia o contador
        if (agora - ultimoClique > 500) {
          clicks = 0;
        }

        clicks++; // Incrementa o clique atual
        ultimoClique = agora; // Atualiza o tempo do último clique

        // Se atingir 5 cliques dentro do intervalo
        if (clicks === 5) {
          changeMode();

          // Opcional: Reinicia o contador para poder detectar novamente
          clicks = 0;
        }
      });

      const home = document.getElementById("home");
      const plr = document.getElementById("player");
      window.openPage = (page) => {
        if (page == "home") {
          plr.classList.remove("active");
          home.classList.add("active");
        } else {
          home.classList.remove("active");
          plr.classList.add("active");
        }
      };
    </script>
  </body>
</html>
